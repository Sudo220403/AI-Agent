name: CI — Agent Reliability & Fault-Injection Suite

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-reliability:
    name: Run Pytest Fault-Injection & GAAP Invariant Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute Fault-Injection & Self-Healing Tests
        env:
          ALPHAVANTAGE_API_KEY: demo
          GOOGLE_API_KEY: ""
        run: |
          pytest -v

      - name: Verify CLI Chaos Simulation Mode
        env:
          ALPHAVANTAGE_API_KEY: demo
          GOOGLE_API_KEY: ""
        run: |
          python -m src.main --ticker IBM --simulate-outage
